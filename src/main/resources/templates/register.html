<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Create account')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<div class="container">
  <form class="form-card" th:action="@{/register}" th:object="${form}" method="post">
    <h1 class="page-title" style="margin-top:0">Join lulumi</h1>
    <p class="page-sub">One account for easy checkout and order tracking.</p>
    <div th:if="${registerError}" class="alert alert-error" th:text="${registerError}"></div>
    <div class="field">
      <label for="fullName">Full name</label>
      <input id="fullName" th:field="*{fullName}" type="text" autocomplete="name" required/>
      <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" th:field="*{username}" type="text" autocomplete="username" required/>
      <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" th:field="*{password}" type="password" autocomplete="new-password" required/>
      <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      <div class="hint">At least 6 characters.</div>
    </div>
    <button class="btn btn-primary" type="submit" style="width:100%">Create account</button>
    <p style="text-align:center">Already have an account? <a th:href="@{/login}">Log in</a></p>
  </form>
</div>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>

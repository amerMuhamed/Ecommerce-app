<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('My Account')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<div class="container">
  <h1 class="page-title">My account</h1>
  <div class="details-grid">
    <div class="form-card" style="margin:0;max-width:none">
      <h2 style="margin-top:0">Profile</h2>
      <ul class="meta-list">
        <li><strong>Name:</strong> <span th:text="${user.fullName}"></span></li>
        <li><strong>Username:</strong> <span th:text="${user.username}"></span></li>
        <li><strong>Member since:</strong> <span th:text="${user.createdDate}"></span></li>
      </ul>
      <p><a class="btn btn-ghost btn-small" th:href="@{/orders}">View my orders</a></p>
    </div>
    <div>
      <h2>Recent orders</h2>
      <div class="table-wrap" th:if="${orders != null && !orders.isEmpty()}">
        <table class="table">
          <thead><tr><th>Order</th><th>Status</th><th>Total</th><th></th></tr></thead>
          <tbody>
          <tr th:each="o : ${orders}">
            <td th:text="'#' + ${o.id}">#1</td>
            <td><span class="status" th:classappend="${o.orderStatus}" th:text="${o.orderStatus}"></span></td>
            <td><span th:text="${#numbers.formatDecimal(o.totalPrice, 1, 2)}"></span> EGP</td>
            <td><a th:href="@{/orders/{id}(id=${o.id})}">View →</a></td>
          </tr>
          </tbody>
        </table>
      </div>
      <p th:if="${orders == null || orders.isEmpty()}">No orders yet. <a th:href="@{/shop}">Start shopping →</a></p>
    </div>
  </div>
</div>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
